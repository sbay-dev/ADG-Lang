apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adg-postgres-optional-walg-https
  namespace: adg-data-plane
spec:
  podSelector:
    matchLabels:
      cpoly.sbay.sa/network-client: walg-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
