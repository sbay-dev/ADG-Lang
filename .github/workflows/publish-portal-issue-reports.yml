name: Publish portal issue reports

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: portal-issue-report-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: msa-adjudication-production
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Publish sanitized reports
        working-directory: tools/msa-adjudication-workbench
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADG_REPOSITORY_RECEIPT_HMAC: ${{ secrets.ADG_REPOSITORY_RECEIPT_HMAC }}
          ADG_PORTAL_ISSUE_REPORTS_URL: ${{ vars.ADG_PORTAL_ISSUE_REPORTS_URL || 'https://adg.sbay.sa/api/repository/issue-reports/claim' }}
        run: node scripts/publish-portal-issue-reports.mjs
